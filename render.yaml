# Render Blueprint for the API. Secrets (sync: false) are asked once when the Blueprint is created.
services:
  - type: web
    name: crous-menu-api
    runtime: docker
    plan: free # switch to a paid instance before sharing widely: free instances sleep after ~15 min idle
    region: frankfurt # closest to Supabase (Paris) and to users in France
    rootDir: backend # Dockerfile and build context resolve relative to this (defaults: ./Dockerfile, .)
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://csrlbhvxeqvheisntowo.supabase.co
      - key: DATABASE_URL # Supabase -> Connect -> Session pooler URI (IPv4)
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PREWARM_TOKEN # any long random string; the same value goes in the GitHub repo secret PREWARM_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS # the web app's URL, e.g. https://crous-menu.pages.dev
        sync: false
