services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: crous
      POSTGRES_PASSWORD: crous # local dev only
      POSTGRES_DB: crous
    ports:
      - "5434:5432" # host port 5434: 5432/5433 are taken by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
